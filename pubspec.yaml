name: studyflow
description: "StudyFlow - aplikasi belajar buatan AE Studio."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^17.5.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#6C5CE7"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#F7F5F0"
  image: assets/icon/splash/ae_mark_light.png
  branding: assets/icon/splash/ae_brand_light.png
  branding_mode: bottom

  color_dark: "#101218"
  image_dark: assets/icon/splash/ae_mark_dark.png
  branding_dark: assets/icon/splash/ae_brand_dark.png

  android_12:
    color: "#F7F5F0"
    image: assets/icon/splash/ae_mark_light.png
    branding: assets/icon/splash/ae_brand_light.png
    color_dark: "#101218"
    image_dark: assets/icon/splash/ae_mark_dark.png
    branding_dark: assets/icon/splash/ae_brand_dark.png

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/icon/splash/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter_18pt-Black.ttf
          weight: 900
